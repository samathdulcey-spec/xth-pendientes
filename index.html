<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XTH</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <main class="contenido">
      <header class="cabecera">
        <h1>XTH</h1>
      </header>

      <section id="vista-hoy" class="vista activa tarjeta" data-vista="hoy" aria-labelledby="titulo-hoy">
        <h2 id="titulo-hoy">Hoy + tareas</h2>
        <div id="urgentes-hoy" class="urgentes"></div>
        <form id="formulario" class="formulario" autocomplete="off">
          <label for="nueva-tarea" class="sr-only">Nueva tarea</label>
          <input id="nueva-tarea" name="titulo" type="text" placeholder="Escribe una tarea y su fecha si aplica" maxlength="200" required>
          <label class="marcar-urgente"><input id="nueva-urgente" type="checkbox"> Urgente</label>
          <button type="submit">Agregar</button>
        </form>
        <p id="error" class="error" role="alert" hidden>La tarea no puede estar vacía.</p>
        <div id="carpetas"></div>
      </section>

      <section id="vista-juego" class="vista activa tarjeta" data-vista="juego" aria-labelledby="titulo-juego">
        <h2 id="titulo-juego">Juego</h2>
        <div id="avatar" class="avatar"></div>
        <div id="juego-panel"></div>
      </section>

      <section id="vista-contenido" class="vista activa tarjeta" data-vista="contenido" aria-labelledby="titulo-contenido">
        <h2 id="titulo-contenido">Contenido</h2>
        <div id="contenido-panel"></div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
